[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolboxmd-versionctl"
version = "8.3.0"
description = "Deterministic repository version mechanics for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ToolboxMD" }
]
dependencies = []

[project.scripts]
versionctl = "versionctl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
